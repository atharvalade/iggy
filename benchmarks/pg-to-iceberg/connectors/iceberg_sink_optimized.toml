# TPC-H SF50 Iceberg Sink — OPTIMIZED
# Uses Zstd compression and 512MB target file size (matching Supermetal defaults).

type = "sink"
key = "iceberg"
enabled = true
version = 0
name = "TPC-H Iceberg sink (optimized)"
path = "../../target/release/libiggy_connector_iceberg_sink"
verbose = false

[[streams]]
stream = "tpch_benchmark"
topics = ["tpch_data"]
schema = "json"
batch_length = 50000
poll_interval = "1ms"
consumer_group = "iceberg_tpch_benchmark"

[plugin_config]
tables = ["tpch.lineitem", "tpch.orders", "tpch.partsupp", "tpch.customer", "tpch.part", "tpch.supplier", "tpch.nation", "tpch.region"]
catalog_type = "rest"
warehouse = "${ICEBERG_WAREHOUSE:-s3://iggy-benchmark-iceberg/}"
uri = "${ICEBERG_CATALOG_URI:-http://localhost:19120/api/v1}"
dynamic_routing = true
dynamic_route_field = "table_name"
store_url = "${S3_ENDPOINT:-https://s3.us-east-1.amazonaws.com}"
store_region = "${AWS_REGION:-us-east-1}"
store_class = "s3"

# Tuned Parquet settings
target_file_size_bytes = 536870912  # 512 MB — matches Supermetal default
parquet_compression = "zstd"        # Better compression ratio than snappy
