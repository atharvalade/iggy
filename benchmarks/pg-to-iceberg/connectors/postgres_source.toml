# TPC-H SF50 PostgreSQL Source — Aggressive polling for snapshot benchmark
# All 8 TPC-H tables: lineitem (300M), orders (75M), partsupp (40M),
# customer (7.5M), part (10M), supplier (500K), nation (25), region (5)

type = "source"
key = "postgres"
enabled = true
version = 0
name = "TPC-H Postgres source"
path = "../../target/release/libiggy_connector_postgres_source"
verbose = false

[[streams]]
stream = "tpch_benchmark"
topic = "tpch_data"
schema = "json"
batch_length = 10000
poll_interval = "1ms"

[plugin_config]
connection_string = "${POSTGRES_CONNECTION_STRING}"
mode = "polling"
tables = ["lineitem", "orders", "partsupp", "customer", "part", "supplier", "nation", "region"]
table_namespace = "tpch"
poll_interval = "100ms"
batch_size = 50000
tracking_column = "id"
initial_offset = "0"
max_connections = 20
snake_case_columns = false
include_metadata = true
verbose_logging = false
max_retries = 5
retry_delay = "2s"
